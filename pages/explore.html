<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore &middot; Tourist Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dashboard.css" />
    <link rel="stylesheet" href="../assets/css/cssPages/explore.css" />
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  </head>
  <body data-page="explore">
    <!-- Sidebar, topbar, mobile nav and modals are injected by Shared/shell.js and Shared/modals.js -->
    <div class="app-shell">
      <div class="content-shell">
        <main class="main-content" id="viewContainer" aria-live="polite">
          <div class="section-head" style="margin-bottom: 16px">
            <div>
              <p class="eyebrow">Explore Destinations &amp; Verified Stays</p>
              <h2>Find Your Perfect Match</h2>
              <p>Discover attractions and hotels positioned next to each other across the Philippines.</p>
            </div>
          </div>

          <div class="explore-controls-bar">
            <div class="explore-filter-grid">
              <div class="explore-field">
                <label for="exploreSearchInput">Search Destinations, Spots, or Hotels</label>
                <input type="text" id="exploreSearchInput" placeholder="Try 'Boracay', 'Calle Crisologo', 'Intramuros'..." />
              </div>

              <div class="explore-field">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter">
                  <option value="all">All Categories</option>
                  <option value="heritage">Heritage &amp; History</option>
                  <option value="beaches">Beaches &amp; Islands</option>
                  <option value="mountain">Mountain Escapes</option>
                  <option value="urban">Urban &amp; Culture</option>
                  <option value="nature">Nature &amp; Wonders</option>
                </select>
              </div>

              <div class="explore-field">
                <label>Filter Reset</label>
                <button type="button" class="btn btn-secondary" style="width: 100%" id="clearFiltersBtn">Clear Filters</button>
              </div>
            </div>

            <div class="explore-type-pills" id="explorePills">
              <button type="button" class="type-pill active" data-filter="all">All (10)</button>
              <button type="button" class="type-pill" data-filter="heritage">Heritage &amp; History</button>
              <button type="button" class="type-pill" data-filter="beaches">Beaches &amp; Islands</button>
              <button type="button" class="type-pill" data-filter="mountain">Mountain Escapes</button>
              <button type="button" class="type-pill" data-filter="urban">Urban &amp; Culture</button>
              <button type="button" class="type-pill" data-filter="nature">Nature &amp; Volcanoes</button>
            </div>
          </div>

          <div class="cards-grid" id="exploreCardsGrid"></div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/scripts/Shared/supabase-client.js"></script>
    <script src="../assets/scripts/Shared/data.js"></script>
    <script src="../assets/scripts/Shared/shell.js"></script>
    <script src="../assets/scripts/Shared/modals.js"></script>
    <script src="../assets/scripts/scriptingPages/explore.js"></script>
  </body>
</html>
