<!doctype html>
<html lang="en">

    <title>My Trips &middot; Tourist Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"

    <link rel="stylesheet" href="../assets/css/style.css" />

      <div class="content-shell">
        <main class="main-content" id="viewContainer" aria-live="polite">
          <div class="section-head">
            <div>
              <p class="eyebrow">My Reservations</p>
              <h2>Hotel Bookings</h2>
              <p>Manage your hotel reservations and payment details.</p>
            </div>
            <a href="explore.html" class="btn btn-primary">Book Another Hotel</a>
          </div>

          <div id="tripsList">
            <div class="form-panel"><p>Loading your reservations...</p></div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
